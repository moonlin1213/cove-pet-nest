[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "cove-pet-nest"
version = "0.1.0"
description = "A local pet room for people and their AI companions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "Pillow>=10.4,<13", "mcp==2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "build>=1.2,<2", "hatchling>=1.25,<2"]

[project.scripts]
cove-pet-nest = "cove_pet_nest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cove_pet_nest"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/examples", "/README.md", "/LICENSE", "/NOTICE.md", "/pyproject.toml", "/requirements.lock"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
